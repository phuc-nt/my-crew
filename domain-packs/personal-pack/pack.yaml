# personal-pack manifest (v57) — thư ký riêng của chủ nhân (CEO), kênh Telegram DM.
#
# Hai kind đẩy-Telegram chủ động: `briefing` (bản tin ngày, cron sáng) và
# `weekly-review` (nhìn lại tuần, cron Chủ Nhật). Chat DM (inbox) ground trên kind đầu
# trong `reports:` của profile qua ToolProvider.
# `servers` rỗng: thư ký không ghi qua MCP nào — kênh ra duy nhất là telegram_send
# (native type, allowlist 2 chiều theo chat_ids của profile, không đi qua allowlist pack).
id: personal
name: Personal (Thư ký riêng)
report_kinds:
  - briefing
  - weekly-review
servers: []
