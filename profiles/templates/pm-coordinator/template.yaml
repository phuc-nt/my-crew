# Staff template — prefill source for the CreateAgent wizard AND the one-click create.
#
# Contract v1 = {role, domain, reports, bindings_hint}. Contract v2 (v97) adds `skills`:
# names of the DOMAIN PACK's skills this role carries. create_agent validates every name
# against the pack and writes them as the profile's `skills` pool, which is what
# `load_skill_pool` reads — an unknown name is a create error, never a silent no-op.
#
# Creating an agent from a template still goes through the SAME `create_agent` path as a
# hand-filled wizard; this file only prefills the wizard's state (IdentityStep/ReportsStep
# + persona from SOUL.md). `bindings_hint` names the binding KEYS the wizard should surface
# for this role — values are still entered by the CEO (never a secret or id guessed here).
role: "Điều phối dự án"
domain: pm
reports:
  - daily
  - weekly
bindings_hint:
  - jira
  - slack

# v97: the pm-pack skills a coordinator's daily/weekly/resource/okr graphs select from.
# Without this list the created agent had an EMPTY skill pool and none of them ever fired.
skills:
  - parse-github-labels
  - flag-risk
  - prioritize-blockers
  - estimate-effort
  - fetch-jira-epics

# v20.5: runtime backend gợi ý (wizard prefill; user override được).
recommended_runtime: native

# v32: lịch mặc định cho vai có báo cáo — validate qua create_agent (kind ∈ reports).
schedule:
  daily: "0 8 * * *"
  weekly: "0 17 * * 5"

# v36 P2: config version — bump when template CONFIG (reports/schedule/tools) changes
# so agents of this role show an upgrade badge. Template-dir skills load live (no bump
# needed); the pack-skill LIST is config, so adding to it bumps.
version: 2
