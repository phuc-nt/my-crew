# Agent registry TEMPLATE — copied to registry.yaml on first run (registry.yaml is
# user data, gitignored since v18). IDs only (no secrets); path = profiles/<id>/.
# enabled: false ⇒ the service skips the agent. An agent also needs profile.yaml
# enabled: true to run (registry is the master switch, the profile is a second gate).
#
# Only ids whose profile is actually SEEDED belong here — `home_seed.py` copies the
# shipped `default` profile and nothing else, so registering anything more would give
# a first-time user a roster row that can never load.
#
# The CEO chat-ops box (and fleet-watch alerts) turn on when an agent with domain
# "admin" + telegram.ops_operator_id exists; both look the agent up by domain, so
# hiring one through the UI is enough — no registry template entry is needed.
agents:
  - id: default
    enabled: true
