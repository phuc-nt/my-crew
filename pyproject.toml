[project]
name = "my-crew"
version = "0.14.0"
description = "my-crew — an autonomous AI crew (agent harness) for a one-person company: read real data, analyze, and act through a single safety gateway."
requires-python = ">=3.12"
dependencies = [
    # v6 M16: single-user session auth — bcrypt hashes the password, itsdangerous signs
    # the session cookie (Starlette's SessionMiddleware). Both small, well-audited.
    "bcrypt>=4.2",
    "croniter>=6.2.2",
    "fastapi>=0.136",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    # The tools-tier work loop defaults to the self-owned thin loop (OpenAI SDK); langchain stays
    # a base dep because the A/B baseline (`loop_engine: langchain` → `create_agent`) and the
    # langgraph orchestration layer (graphs/checkpoint/interrupt) still import it, and it must
    # resolve without the optional `deep` extra.
    "langchain>=1.3,<1.4",
    "langchain-core>=1.4.8",
    "langchain-mcp-adapters==0.3.0",
    # Pinned below 2.0: langchain-mcp-adapters 0.3.0 imports
    # `mcp.shared.context.RequestContext`, which mcp 2.0.0 removed, and the adapter
    # declares no upper bound. Without this pin a fresh install resolves mcp 2.0.0 and
    # every MCP-backed integration (Jira, Confluence, Slack) fails at import.
    "mcp<2",
    "langchain-openai>=0.3,<1.0",
    "langgraph>=1.2.6",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langsmith>=0.8.18",
    "openai>=2.43.0",
    # psycopg[binary] bundles libpq so the Postgres path imports without a system
    # libpq install (M2-P8 — Postgres is opt-in; the binary wheel keeps the default
    # SQLite install self-contained on macOS/Linux without external libpq).
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    # v87 P2: comment-preserving round-trip writes to profile.yaml from the web (dry-run
    # toggle + future config-form writes). PyYAML's safe_load/safe_dump rebuilds the
    # document and drops comments + hand-written keys it doesn't model — the same class
    # of bug as the save_company rebuild-from-dict issue. ruamel.yaml's round-trip loader
    # preserves comments, key order, and quote/flow styles across a targeted patch.
    "ruamel.yaml>=0.18",
    "sse-starlette>=2.1",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
# v20.5: the DeepAgentRuntime backend (agent_runtime: deep_agent). EXPERIMENTAL — deepagents is
# Beta and pulls langchain-anthropic/google-genai; its shell runs ONLY inside a self-hosted
# Docker sandbox (never the host). Optional so the base install stays light + never needs Docker.
# Install with `uv sync --extra deep`; the `docker` SDK drives the local sandbox container.
deep = ["deepagents==0.6.12", "docker>=7.1"]

[project.scripts]
my-crew = "my_crew.entrypoints.mpm:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_crew"]

# Shipped resources live at the repo root for the checkout workflow; the wheel maps
# them under my_crew/_shipped/ where settings.SHIPPED_ROOT resolves them.
[tool.hatch.build.targets.wheel.force-include]
"profiles/default" = "my_crew/_shipped/profiles/default"
"profiles/templates" = "my_crew/_shipped/profiles/templates"
"domain-packs" = "my_crew/_shipped/domain-packs"
"registry.example.yaml" = "my_crew/_shipped/registry.example.yaml"
".env.example" = "my_crew/_shipped/.env.example"
"config/model_prices.yaml" = "my_crew/_shipped/config/model_prices.yaml"
"config/mcp-server-pins.sh" = "my_crew/_shipped/config/mcp-server-pins.sh"

[tool.ruff]
# snake_case Python, type hints on public fns (code-standards.md)
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    # Starlette's TestClient deprecated its httpx backend; httpx2 is a separate package
    # that installs alongside httpx, so the openai SDK keeps the httpx it depends on.
    "httpx2>=2.11.0",
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]
