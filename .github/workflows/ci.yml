# CI: the suite is secret-free by design (tests/conftest.py isolates env + tmp dirs),
# so every job runs on plain PyPI/npm with no credentials.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # setup-uv stopped publishing floating major/minor tags at v8 (supply-chain
      # hardening), so this pin is a full version on purpose — bump it deliberately.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --extra deep
      - run: uv run ruff check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Build for real, not just --noEmit: a stale committed dist bit us before
      # (v32); tsc -b + vite build is the honest gate. NOTE: this does NOT diff the
      # rebuilt output against the committed dist (vite hash stability across
      # runners is unverified) — docs/releasing.md step 2 is the stale-dist guard.
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  # v56: layout smoke for the v55 cockpit — jsdom cannot measure layout, so these run
  # in real chromium via Playwright with the whole /api surface mocked in-browser
  # (see web/e2e/support/mock-api.ts). Secret-free like everything else here.
  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Cold start from the real wheel. The suite runs against the source tree, so a
  # packaging break — a dropped force-include, a stale committed frontend bundle —
  # is invisible to every other job here and fails only on a user's machine.
  #
  # This job used to stop at `--version` + `agent list`. The script goes further and
  # serves over HTTP, which is where a missing frontend bundle actually shows up, then
  # loads the login screen in real chromium.
  cold-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv stopped publishing floating major/minor tags at v8 (supply-chain
      # hardening), so this pin is a full version on purpose — bump it deliberately.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: scripts/cold-start-smoke.sh --browser
